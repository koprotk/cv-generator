[project]
name = "cv-generator"
version = "0.1.1"
description = "Generate Harvard-style CV PDFs from a YAML single source."
authors = [
    {name = "Daniel Muñoz", email = "demunoz2@uc.cl"}
]
readme = {file = "README.org", content-type = "text/plain"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML (>=6.0,<7.0)",
    "Jinja2 (>=3.1,<4.0)",
    "bibtexparser (>=1.4,<2.0)",
]

[project.scripts]
cv-generator = "cv_generator.cli:main"

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_generator"]
